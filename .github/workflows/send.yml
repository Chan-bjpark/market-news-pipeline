name: send briefing

# 수집(deal_ingest collect) 완료 직후 자동 실행 → 항상 최신 데이터, cron 정시지연 회피.
on:
  workflow_run:
    workflows: ["deal_ingest collect"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: send-briefing
  cancel-in-progress: false

jobs:
  send:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send briefing to Slack
        working-directory: deal_ingest
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BRIEFING_DIR: "."
        run: python slack_briefing.py
